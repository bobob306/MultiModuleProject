name: Android Auto Release

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 🔍 Fetch all tags and history so git knows about current live tags

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode keystore from GitHub secret safely without trailing newlines
      - name: Decode Keystore
        run: echo -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore

      # Build signed release APK with env vars safely wrapped in single quotes
      - name: Build Signed Release APK
        env:
          SIGN_STORE_FILE: /tmp/release.keystore
          SIGN_STORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}'
          SIGN_KEY_ALIAS: '${{ secrets.KEY_ALIAS }}'
          SIGN_KEY_PASSWORD: '${{ secrets.KEY_PASSWORD }}'
        run: ./gradlew assembleRelease --info

      - name: List APK files (debugging)
        run: ls -lah app/build/outputs/apk/release/

      # Fetches the absolute latest release tag using clean JSON formatting
      - name: Get Latest Tag or Use Default
        id: latest_tag
        run: |
          latest_tag=$(gh release list --limit 1 --json tagName --jq '..tagName' --repo ${{ github.repository }})
          # 🚨 SAFETY NET: If API drops or no releases found, default to v0.0.9999
          if [[ -z "$latest_tag" || ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest_tag="v0.0.9999"
          fi
          echo "Latest found tag is: $latest_tag"
          echo "tag=$latest_tag" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bump patch version for new tag (e.g., v0.0.17 -> v0.0.18, or v0.0.9999 -> v0.0.10000)
      - name: Bump Patch Version
        id: bump
        run: |
          tag=${{ steps.latest_tag.outputs.tag }}
          IFS='.' read -r major minor patch <<<"${tag#v}"
          patch=$((patch + 1))
          new_tag="v${major}.${minor}.${patch}"
          echo "New bumped tag will be: $new_tag"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      # Create GitHub Release and upload APK
      - name: Upload Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: Release ${{ steps.bump.outputs.new_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true # 📝 FIXED: Automatically pulls commit headers for your release notes!
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
